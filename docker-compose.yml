# Docker Compose — production stack for the Minivers site.
#
# Usage:
#   1. cp .env.example .env  (edit values, set DJANGO_DEBUG=false)
#   2. docker compose up --build -d
#   3. The app answers on http://localhost:${APP_PORT} (default: 8000).
#
# The web service runs gunicorn behind WhiteNoise (static files), backed by a
# PostgreSQL 16 service with a named volume. Migrations + collectstatic run at
# container start via entrypoint.sh.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # HOST port only, for local clients (psql, GUI). Inside the compose
      # network Postgres always listens on 5432 — that's what DB_PORT is for.
      # Comment this block if you don't want Postgres reachable from the host.
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      # pg_isready is shipped with the postgres image; exit 0 means "accepting connections".
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Django
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      # Outside /app: collectstatic and uploads must not write into the
      # bind-mounted source tree, which the container user cannot own.
      STATIC_ROOT: /var/www/static
      MEDIA_ROOT: /var/www/media
      # Database
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      # Port INSIDE the compose network, not the host mapping (see DB_HOST_PORT).
      DB_PORT: ${DB_PORT:-5432}
      # Gunicorn
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Uploaded media must survive container replacement.
      - media_data:/var/www/media
      # Static files are baked in at start by collectstatic; no volume needed.
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8000
      - --workers
      - ${GUNICORN_WORKERS:-3}
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - minivers.wsgi:application

volumes:
  pg_data:
  media_data:
