{% comment %}
Nav principale partagée (rendue par le tag {% load nav %} / {% nav %}).
Structure identique au mock : mêmes classes, mêmes id (panier JS).
{% endcomment %}
<nav>
<a href="{% url 'main:home' %}" class="logo">Mini<span>vers</span></a>
<ul>
{% for item in items %}
<li><a href="{{ item.href }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
{% endfor %}
</ul>
<div class="nav-right">
<button class="btn-cart" onclick="toggleCart()">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
<span class="cart-count" id="cartCount">0</span>
</button>
<button class="btn-resa" onclick="toggleCart()">Réserver</button>
</div>
</nav>
